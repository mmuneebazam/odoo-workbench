<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Odoo Workbench dashboard concept</title>
  <desc id="desc">Illustrative desktop dashboard showing Odoo installations, running sessions, database health and module dependencies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="920" gradientUnits="userSpaceOnUse"><stop stop-color="#171821"/><stop offset="1" stop-color="#101116"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c3a6ff"/><stop offset="1" stop-color="#795ce7"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65d69a"/><stop offset="1" stop-color="#2aa96e"/></linearGradient>
    <linearGradient id="glow" x1="210" y1="60" x2="1240" y2="820" gradientUnits="userSpaceOnUse"><stop stop-color="#8463ed" stop-opacity=".16"/><stop offset="1" stop-color="#181921" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity=".46"/></filter>
    <style>
      .t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#eef0f5}
      .muted{fill:#9496a6}.faint{fill:#686b7a}.small{font-size:13px}.tiny{font-size:11px}.med{font-size:15px}.bold{font-weight:650}.mono{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace}
      .line{stroke:#2b2d38;stroke-width:1}
    </style>
  </defs>
